<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="70%" stop-color="#0f3d23"/>
      <stop offset="100%" stop-color="#061f12"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cf9e6e"/>
      <stop offset="60%" stop-color="#a87544"/>
      <stop offset="100%" stop-color="#784c24"/>
    </linearGradient>
    <radialGradient id="tummy" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffeedb"/>
      <stop offset="100%" stop-color="#fbd9b3"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Jungle Leaves in background -->
  <path d="M 60 120 Q 150 40 260 90 Q 160 180 60 120 Z" fill="#22c55e" opacity="0.6"/>
  <path d="M 450 140 Q 360 50 250 100 Q 350 200 450 140 Z" fill="#4ade80" opacity="0.5"/>
  <path d="M 40 380 Q 140 320 200 420 Q 90 470 40 380 Z" fill="#15803d" opacity="0.7"/>

  <!-- Wooden Hanging Branch -->
  <g filter="url(#shadow)">
    <path d="M -20 180 Q 256 220 532 170" stroke="#78350f" stroke-width="36" stroke-linecap="round" fill="none"/>
    <path d="M -20 170 Q 256 210 532 160" stroke="#16a34a" stroke-width="12" fill="none"/>
    <!-- Small Pink Hibiscus Blossom on branch -->
    <circle cx="160" cy="180" r="16" fill="#f43f5e"/>
    <circle cx="160" cy="180" r="6" fill="#fde047"/>
  </g>

  <!-- Hero Sloth Hanging -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="256" cy="330" rx="105" ry="120" fill="url(#fur)"/>
    <ellipse cx="256" cy="345" rx="68" ry="80" fill="url(#tummy)"/>

    <!-- Arms Clinging to Branch -->
    <path d="M 185 320 Q 160 210 205 180" stroke="#a87544" stroke-width="44" stroke-linecap="round" fill="none"/>
    <path d="M 327 320 Q 352 210 307 180" stroke="#a87544" stroke-width="44" stroke-linecap="round" fill="none"/>

    <!-- 3 Claws on Each Hand -->
    <g fill="#fef3c7" stroke="#78350f" stroke-width="3">
      <ellipse cx="195" cy="172" rx="7" ry="14" transform="rotate(-15 195 172)"/>
      <ellipse cx="207" cy="170" rx="7" ry="14"/>
      <ellipse cx="219" cy="174" rx="7" ry="14" transform="rotate(15 219 174)"/>

      <ellipse cx="293" cy="174" rx="7" ry="14" transform="rotate(-15 293 174)"/>
      <ellipse cx="305" cy="170" rx="7" ry="14"/>
      <ellipse cx="317" cy="172" rx="7" ry="14" transform="rotate(15 317 172)"/>
    </g>

    <!-- Head -->
    <circle cx="256" cy="275" r="82" fill="url(#fur)"/>

    <!-- Soft Cheeks and Muzzle -->
    <ellipse cx="256" cy="295" rx="55" ry="40" fill="url(#tummy)"/>

    <!-- Characteristic Sloth Dark Eye Mask -->
    <ellipse cx="220" cy="272" rx="28" ry="20" transform="rotate(-10 220 272)" fill="#3c2010"/>
    <ellipse cx="292" cy="272" rx="28" ry="20" transform="rotate(10 292 272)" fill="#3c2010"/>

    <!-- Glossy Eyes with Catchlights -->
    <circle cx="222" cy="272" r="15" fill="#ffffff"/>
    <circle cx="222" cy="272" r="11" fill="#1b120c"/>
    <circle cx="218" cy="268" r="5" fill="#ffffff"/>
    <circle cx="226" cy="276" r="2.5" fill="#ffffff"/>

    <circle cx="290" cy="272" r="15" fill="#ffffff"/>
    <circle cx="290" cy="272" r="11" fill="#1b120c"/>
    <circle cx="286" cy="268" r="5" fill="#ffffff"/>
    <circle cx="294" cy="276" r="2.5" fill="#ffffff"/>

    <!-- Shiny Black Nose -->
    <ellipse cx="256" cy="284" rx="16" ry="11" fill="#18181b"/>
    <circle cx="252" cy="280" r="4" fill="#ffffff"/>

    <!-- Friendly Smile -->
    <path d="M 242 305 Q 256 318 270 305" stroke="#3c2010" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
