name: Gates (art, known lists, clip, draw)

# The gates that are not unit tests (reference/methods/gates.md, LAWS.md law 5). deploy.yml calls this before it publishes, so a
# failing gate blocks the live site. The unit tests (playerText.test.ts among them) run in deploy.yml's own test shards.
#   gates      artcheck (1 s) + build and chunkcheck (about 30 s) + knowncheck (1 s) + roadmapcheck (1 s) + clipcheck (about 3 min): about 4.5 min with setup (measured 2026-11-01)
#   drawcheck  its own runner, side by side: about 6.5 min with setup (measured 2026-11-01)
#   rolled     the rolled stages' proven-seed lists (seedlist --check: every listed seed clean on both settings, its replay identical to
#              its search) and the stage-start build time (buildcheck: p95 <= 150 ms at CPU x4): about 1 + 3 min here, 2026-11-06
# Both run alongside deploy.yml's test shards, so they add to the deploy only if they outlast the slowest shard.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # knowncheck compares the known lists with main before this change
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: node tools/perf/artcheck.mjs
      # every JS chunk at least 200 KB under Workbox's 4 MiB precache limit (R-165.103; tools/perf/chunkplan.mjs splits the game into
      # layered files). Built AS THE DEPLOY BUILDS (deploy.yml publish: the same BASE_PATH), so the gate measures the files that ship:
      # the base is written into every picture's address inside the scripts, and a plain build is smaller (LESSONS D45: 0.9.6 shipped
      # 254 B over while a plain build passed). chunkcheck itself fails a build whose base is not CHUNKCHECK_BASE; src/game/chunkGate.test.ts
      # holds this step and the deploy's to the same base.
      - run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: node tools/perf/chunkcheck.mjs
        env:
          CHUNKCHECK_BASE: /${{ github.event.repository.name }}/
      - run: node tools/perf/knowncheck.mjs
      # engine code never names one stage, world, seed or x position (R-165.123, D43): today's debt is its shrink-only known list
      - run: npx tsx tools/engine/generalitycheck.ts
      # open work in the repo (defect log, known lists, NEXT.md files) must have an R-id on reference/ROADMAP.md; done items need a real
      # PR or commit (needs the full history above)
      - run: node tools/roadmapcheck.mjs
      # the browser the clip check drives (Chrome's safe-area override needs a recent one); not a project dependency
      - run: npm install --no-save --no-audit --no-fund --legacy-peer-deps playwright@1.63.0 && npx playwright install --with-deps chromium
      # shell: bash runs with pipefail, so the check's exit code survives the tee (the default shell here has no pipefail: a crash
      # showed green on the first run)
      - run: node tools/perf/clipcheck.mjs | tee clipcheck.log
        shell: bash
        env:
          CLIPCHECK_OUT: clipcheck-out
      # the testers' text boxes stay above a phone keyboard (30-60% of the screen), with a planted failure (kbdcheck.mjs)
      - run: node tools/perf/kbdcheck.mjs | tee kbdcheck.log
        shell: bash
      - name: Keep the clip check's contact sheet and breaches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipcheck
          path: |
            clipcheck.log
            kbdcheck.log
            clipcheck-out/contact.jpg
            clipcheck-out/breaches.json
          if-no-files-found: ignore

  drawcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm install --no-save --no-audit --no-fund --legacy-peer-deps playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node tools/perf/drawcheck.mjs

  rolled:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      # (the engine tools' own tests, outside the suite glob: the section library, the seed-list writer, the seed yield, the travel
      # bots, 1-3's designed arc (library13), the cast bots (castBots, F13 11-12), the one roll tool and the registry gate (libstage,
      # registrycheck, ADD-LEVEL R-165.187: about 50 s); PROOF-1 violation 5, about 5 s. src/game/ciTests.test.ts fails on a test file no workflow runs)
      - run: npx tsx --test tools/engine/library.test.ts tools/engine/seedlist.test.ts tools/engine/yield.test.ts tools/inspect/travelBots.test.ts tools/engine/library13.test.ts tools/inspect/castBots.test.ts tools/inspect/routeHumps.test.ts tools/engine/libstage.test.ts tools/engine/registrycheck.test.ts
      # (an engine or kit change that stales a rolled stage's seed list fails here until the list is rebuilt: tools/engine/seedlist.ts <id>;
      # EVERY proven list, each by name, from the index: registrycheck.ts --lists. ADD-LEVEL R-165.187: CI checked only 1-1's)
      - run: for s in $(npx tsx tools/engine/registrycheck.ts --lists); do echo "== $s"; npx tsx tools/engine/seedlist.ts "$s" --check || exit 1; done
      # (every stage-table stage registered everywhere: kit, config, routed, levelSeeds, sheets, a drawcheck scenario, a seed list or stand-in,
      # flown rows. ADD-LEVEL R-165.187, D51; seconds)
      - run: npx tsx tools/engine/registrycheck.ts
      # (the child, middle and expert bots, R-165.59: mapped from the tester profiles and calibrated on 1-1; a change to 1-1, the engine
      # or the bots that moves a run fails here until the calibration is re-run and calibration-main.jsonl recommitted with it,
      # reference/qa-reports/R-165.59/BOTS.md; about 40 s)
      - run: npx tsx --test tools/inspect/tierBots.test.ts
      - run: npm install --no-save --no-audit --no-fund --legacy-peer-deps playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node tools/perf/buildcheck.mjs
