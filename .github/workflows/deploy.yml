name: Publish game to the gh-pages branch

# Every push to main builds the game and force-publishes the built site to the
# `gh-pages` branch. GitHub Pages is set to "Deploy from a branch" -> gh-pages -> / (root),
# the same way the NeuroBrew site is released.
#   https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the gh-pages branch
  pages: write # ask Pages to rebuild (a push made with GITHUB_TOKEN does not start a Pages build by itself)

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx tsx --test src/audio/*.test.ts src/game/*.test.ts src/components/*.test.ts src/components/**/*.test.ts
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # .nojekyll: the files are already built, so Pages must not run Jekyll over them
      # 404.html: a copy of the game so a mistyped or deep link still opens it
      - run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Ask Pages to build the new branch contents
        continue-on-error: true # fails harmlessly until Pages is switched on in Settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
