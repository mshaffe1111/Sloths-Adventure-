name: Build Sloths Adventure Android APK

on:
  push:
    branches: [ "main" ]
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Sloths Adventure)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sloths-Adventure Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Game Dependencies
        run: npm ci

      - name: Build Vite Web Game (Outputs to dist/)
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android (Auto-Wrap)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sloths Adventure" "com.mshaffe1111.slothadventure" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Sloths Adventure APK
        uses: actions/upload-artifact@v4
        with:
          name: sloths-adventure-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Release (If Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
