name: Build Sloths Adventure Android APK

# One `push` key only: GitHub rejects a workflow that lists it twice (the runs failed at once, with no step run)
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write # the tagged-release step attaches the APK

jobs:
  build-apk:
    name: Build Android APK (Sloths Adventure)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sloths-Adventure Repository
        uses: actions/checkout@v4

      # (the same Node and install as the site's publish workflow: the project has bun.lock, no package-lock.json, so no npm ci or npm cache)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Game Dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Vite Web Game (Outputs to dist/)
        run: npm run build

      # Capacitor 7 and up build with Java 21 (Gradle refuses 17)
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # the action's default package list still asks for 'tools', which Google retired, and sdkmanager fails on it
      # ("Failed to find package 'tools'"): ask for platform-tools only (Gradle fetches the platform and build tools it needs)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Initialize Capacitor Android (Auto-Wrap)
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sloths Adventure" "com.mshaffe1111.slothadventure" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Sloths Adventure APK
        uses: actions/upload-artifact@v4
        with:
          name: sloths-adventure-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish to GitHub Release (If Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
